name: ci

# Every server test with a real PostgreSQL, then the browser check of the web app.
on:
  push:
    branches: [main]
    paths-ignore: ["ios/**", ".github/workflows/ios-ipa.yml", ".github/workflows/actions-storage-cleanup.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: assistant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:local-test-password@127.0.0.1:5432/assistant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python dependencies
        run: pip install -r requirements.txt pytest
      - name: Server tests (real database included)
        run: python -m pytest -q
      - name: Browser dependencies (tests only)
        run: |
          npm install --prefix /tmp/assistant-browser playwright
          /tmp/assistant-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Web interface in desktop and phone sizes
        env:
          NODE_PATH: /tmp/assistant-browser/node_modules
        run: |
          node --check bot/web/app.js
          node tests/web-browser.cjs
