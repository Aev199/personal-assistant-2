name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run assistant-mode regressions
        run: |
          pytest -q \
            tests/test_product_mode.py \
            tests/test_main_menu_keyboard.py \
            tests/test_freeform_intake.py \
            tests/test_system_freeform_route.py \
            tests/test_system_undo.py

      - name: Run full suite diagnostic
        continue-on-error: true
        shell: bash
        run: pytest -q 2>&1 | tee pytest-output.txt

      - name: Upload full-suite output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: error
          retention-days: 7
