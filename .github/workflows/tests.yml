name: tests

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/actions-storage-cleanup.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run assistant-mode regressions
        run: |
          pytest -q \
            tests/test_product_mode.py \
            tests/test_product_mode_spa.py \
            tests/test_habit_policy.py \
            tests/test_main_menu_keyboard.py \
            tests/test_home_screen_contract.py \
            tests/test_secondary_surfaces_contract.py \
            tests/test_freeform_intake.py \
            tests/test_capture_spa.py \
            tests/test_system_freeform_route.py \
            tests/test_system_undo.py \
            tests/test_deepseek_adapter.py \
            tests/test_llm_router.py \
            tests/test_onboarding.py

      - name: Run full suite diagnostic on failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: pytest -q 2>&1 | tee pytest-output.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: warn
          retention-days: 3
