name: web-interface
on:
  push:
    branches: [feat/unified-assistant-web]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: assistant_web_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:local-test-password@127.0.0.1:5432/assistant_web_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python dependencies
        run: pip install -r requirements.txt pytest
      - name: API and real database acceptance
        run: >-
          python -m pytest -q
          tests/test_web_auth.py tests/test_web_app.py
          tests/test_capture_idempotency.py tests/test_task_browser.py
          tests/test_web_postgres.py tests/test_companion_http.py
          tests/test_native_intake.py tests/test_ideas.py tests/test_calendar_today.py
      - name: Browser dependencies (tests only)
        run: |
          npm install --prefix /tmp/assistant-browser playwright
          /tmp/assistant-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Desktop and mobile browser acceptance
        env:
          NODE_PATH: /tmp/assistant-browser/node_modules
          SCREENSHOT_DIR: browser-previews
        run: |
          node --check bot/web/app.js
          node tests/web-browser.cjs
      - name: Save interface previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-web-previews
          path: browser-previews
          if-no-files-found: ignore
          retention-days: 3
