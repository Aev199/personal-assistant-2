<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f9fa"><title>Ассистент</title><link rel="stylesheet" href="/app/app.css"><script src="/app/app.js" defer></script></head>
<body>
<section id="login" class="login" hidden><form id="connect-form" class="connect-card"><div class="brand"><span class="logo">А</span>Ассистент</div><h1>Подключение</h1><p>Введите ключ доступа к вашему помощнику. На этом устройстве достаточно сделать это один раз.</p><label for="access-key">Ключ доступа</label><input id="access-key" type="password" required autocomplete="off" maxlength="512"><button class="primary" type="submit">Подключиться</button><p id="login-error" class="error" role="alert"></p></form></section>
<div id="shell" class="app" hidden>
<aside class="sidebar"><div class="brand"><span class="logo">А</span>Ассистент</div><div class="nav-caption">ОБЗОР</div><nav id="desktop-nav" aria-label="Основная навигация"></nav><div class="sidebar-bottom"><span id="connection-state">Подключено к серверу</span><button id="logout" class="text-button">Выйти</button></div></aside>
<div class="workspace"><header class="topbar"><div class="breadcrumb">Личное пространство <span>/</span> <strong id="breadcrumb">Сегодня</strong></div><form id="capture-form" class="capture-form"><span class="plus" aria-hidden="true">+</span><input id="capture" aria-label="Добавить задачу или мысль" placeholder="Добавить задачу или мысль…" autocomplete="off" maxlength="2000"><button type="submit" aria-label="Сохранить запись" title="Сохранить запись">↵</button></form></header><div id="capture-status" class="capture-status" role="status"></div><div id="page-error" class="page-error" role="alert" hidden></div><main id="content" tabindex="-1" aria-live="polite"></main></div>
<nav id="mobile-nav" class="mobile-nav" aria-label="Нижняя навигация"></nav>
</div>
<dialog id="task-dialog" class="task-dialog" aria-labelledby="detail-title"></dialog><div id="toast" class="toast" role="status"></div>
<noscript>Для работы помощника нужно включить JavaScript.</noscript>
</body></html>
