name: AssistantPocket
options:
  bundleIdPrefix: com.aev199
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  AssistantPocket:
    type: application
    platform: iOS
    sources:
      - path: AssistantPocket/App
    info:
      path: AssistantPocket/App/Info.plist
      properties:
        CFBundleDisplayName: Assistant
        CFBundleURLTypes:
          - CFBundleURLName: com.aev199.assistantpocket
            CFBundleURLSchemes:
              - assistantpocket
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aev199.assistantpocket
        PRODUCT_NAME: AssistantPocket
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: AssistantPocketWidget
        embed: true

  AssistantPocketWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AssistantPocket/Widget
    info:
      path: AssistantPocket/Widget/Info.plist
      properties:
        CFBundleDisplayName: Assistant Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aev199.assistantpocket.widget
        PRODUCT_NAME: AssistantPocketWidget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  AssistantPocket:
    build:
      targets:
        AssistantPocket: all
        AssistantPocketWidget: all
    run:
      config: Debug
    archive:
      config: Release
