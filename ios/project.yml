name: AssistantPocket
options:
  bundleIdPrefix: com.aev199
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  AssistantPocket:
    type: application
    platform: iOS
    sources:
      - path: AssistantPocket/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aev199.assistantpocket
        PRODUCT_NAME: AssistantPocket
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Assistant
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  AssistantPocket:
    build:
      targets:
        AssistantPocket: all
    run:
      config: Debug
    archive:
      config: Release
